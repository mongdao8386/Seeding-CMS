[project]
name = "seeding-cms"
version = "0.1.0"
description = "CMS seeding da kenh - giai doan 01: pipeline chay thong tren Reddit"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "arq>=0.26",
    "redis>=5.2",
    "praw>=7.8",
    "imageio-ffmpeg>=0.5",
    "pillow>=11",
    "imagehash>=4.3",
    "python-multipart>=0.0.20",
    "httpx>=0.28",
    "structlog>=24.4",
    # Instagram qua API rieng cua app (async fork cua instagrapi).
    "aiograpi>=1.12",

    # Kho mat: cookie jar va ma 2FA.
    "cryptography>=44",
    "pyotp>=2.9",

    # Trinh duyet chong nhan dien. `[geoip]` KHONG phai tuy chon:
    # browser/session.py bat geoip=True cho moi profile co proxy, de Camoufox suy
    # timezone va ngon ngu tu IP THAT cua proxy. Thieu extra do thi moi profile co
    # proxy - tuc la moi profile that - nem NotInstalledGeoIPExtra ngay khi mo.
    # Va neu tat geoip di cho xong chuyen thi con te hon: mot proxy dan cu Viet Nam
    # chay voi timezone My la fingerprint tu mau thuan, dung thu ma ca he thong nay
    # ton tai de tranh.
    "camoufox[geoip]>=0.5",
    # Co so du lieu mui gio. Windows KHONG co san: thieu no thi ZoneInfo("Asia/Ho_Chi_Minh")
    # nem loi va planner khong bam duoc bai vao khung gio vang.
    "tzdata>=2025.2",
    "playwright>=1.49",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]
# Duong thiet bi that. Tach rieng vi no con can adb va Appium server ben ngoai,
# khong cai bang pip duoc - xem GET /devices/preflight.
device = ["Appium-Python-Client>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seeding"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Migration do Alembic tu sinh - sua tay de vua style thi lan sau autogenerate lai hong.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = [
    # Depends(...) o gia tri mac dinh la idiom chuan cua FastAPI, khong phai loi.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# arq doc thang cac thuoc tinh lop nay, khong the boc ClassVar.
"src/seeding/worker/settings.py" = ["RUF012"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Mot event loop cho ca phien test. Engine la singleton toan module, ma connection
# cua asyncpg thi gan voi loop da tao ra no - moi test mot loop se lam pool vo.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "browser: can mo Camoufox that - cham, chay bang: pytest -m browser",
    "media: chay ffmpeg that - cham, chay bang: pytest -m media",
]
# Mac dinh bo qua test trinh duyet cho vong lap nhanh.
addopts = "-m 'not browser and not media'"
