# Chi chay ha tang. App va worker chay trc tiep tren may cho de debug.
# Cong da doi khac mac dinh de khong dung do voi Postgres/Redis co san tren may.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: seeding
      POSTGRES_PASSWORD: seeding
      POSTGRES_DB: seeding
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seeding"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
